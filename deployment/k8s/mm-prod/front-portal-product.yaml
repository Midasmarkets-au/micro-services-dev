apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-portal-product
  namespace: mm-prod
  labels:
    app: front-portal-product
spec:
  replicas: 3
  selector:
    matchLabels:
      app: front-portal-product
  template:
    metadata:
      labels:
        app: front-portal-product
    spec:
      tolerations:
        - key: workload-type
          value: production
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-type
                    operator: In
                    values: ["production"]
        # 软反亲和:尽量把副本分散到不同节点(不强制,避免 pod 卡 Pending)
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: front-portal-product
      containers:
        - name: front-portal-product
          image: 961341529237.dkr.ecr.ap-southeast-2.amazonaws.com/front-portal-product:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 800m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: front-portal-product
  namespace: mm-prod
  labels:
    app: front-portal-product
spec:
  type: ClusterIP
  selector:
    app: front-portal-product
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: front-portal-product
  namespace: mm-prod
  labels:
    app: front-portal-product
spec:
  # 主动中断(节点轮换/drain/consolidation/drift)时,任何时刻至少保留 2 个副本可用,
  # Karpenter 会逐个驱逐、等新副本就绪后再动下一个,实现滚动迁移、服务不中断。
  minAvailable: 2
  selector:
    matchLabels:
      app: front-portal-product
