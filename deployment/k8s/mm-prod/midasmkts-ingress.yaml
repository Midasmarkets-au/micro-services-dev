# ============================================================================
#  midasmkts-ingress — Production 主路由（portal.midasmkts.com / vu.midasmkts.com）
#  IngressClass: nginx-prod（独立 production NGINX controller）
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: midasmkts-ingress
  namespace: mm-prod
  labels:
    app: midasmkts
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-prod
  rules:
    - host: portal.midasmkts.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-portal-product
                port:
                  number: 80
    - host: vu.midasmkts.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-portal-product
                port:
                  number: 80
---
# ============================================================================
#  midasmkts-event-ingress — SSE /api/v1/event for midasmkts.com
#  注意：boardcast 服务在 mm namespace，跨 namespace Ingress backend 不支持
#  如需 SSE 生效，需在 mm-prod 创建 boardcast ExternalName service
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: midasmkts-event-ingress
  namespace: mm-prod
  labels:
    app: midasmkts
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/rewrite-target: /event
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx-prod
  rules:
    - host: portal.midasmkts.com
      http:
        paths:
          - path: /api/v1/event(/|$)
            pathType: ImplementationSpecific
            backend:
              service:
                name: boardcast
                port:
                  number: 9003
    - host: vu.midasmkts.com
      http:
        paths:
          - path: /api/v1/event(/|$)
            pathType: ImplementationSpecific
            backend:
              service:
                name: boardcast
                port:
                  number: 9003
