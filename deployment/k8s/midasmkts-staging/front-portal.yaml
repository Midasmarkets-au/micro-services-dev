# ============================================================================
#  front-portal-staging — Next.js 客户门户 (midasmkts staging)
#  镜像：961341529237.dkr.ecr.ap-southeast-2.amazonaws.com/front-portal:latest
#        docker build -f app/web/react/Dockerfile app/web/react
#  端口：3000 (HTTP, Next.js standalone)
#  入口：portal.midasmarkets.org
#        /                     → front-portal-staging:80
#        Next.js Route Handler → front-portal-staging:80
#        /api /hub /live /connect /.well-known → api-backend-staging (api.midasmkts.net)
#
#  说明：本 namespace 无 in-cluster mono/auth，后端统一走 api.midasmkts.net
#        （复用已存在的 api-backend-staging ExternalName Service）。
#        与 mm namespace 的 bacera-ingress 相比，去掉了 mono/auth 拆分，
#        仅保留「哪些 /api/* 属于 Next.js 自身 Route Handler」的判断。
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-portal-staging
  namespace: midasmkts-staging
  labels:
    app: front-portal-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-portal-staging
  template:
    metadata:
      labels:
        app: front-portal-staging
    spec:
      containers:
        - name: front-portal-staging
          image: 961341529237.dkr.ecr.ap-southeast-2.amazonaws.com/front-portal:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # 服务端(SSR / server actions / route handlers)调用的后端 API 基址。
            # 本 namespace 无 in-cluster mono，走外部服务（与 mm/front-portal 一致）。
            - name: API_BASE_URL
              value: "https://midasmarkets.net.au"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: front-portal-staging
  namespace: midasmkts-staging
  labels:
    app: front-portal-staging
spec:
  type: ClusterIP
  selector:
    app: front-portal-staging
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# ============================================================================
#  front-portal-staging Ingress — 前端 + Next.js Route Handler (HTTP → :80)
#  Next.js 自身处理的 /api/* 前缀（比 -api Ingress 的裸 /api 更长，优先命中）
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-portal-staging
  namespace: midasmkts-staging
  labels:
    app: front-portal-staging
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: portal.midasmarkets.org
      http:
        paths:
          # --- Next.js 自身 Route Handler，必须留在前端容器 ---
          - path: /api/user/
            pathType: Prefix
            backend:
              service:
                name: front-portal-staging
                port:
                  number: 80
          - path: /api/action
            pathType: Prefix
            backend:
              service:
                name: front-portal-staging
                port:
                  number: 80
          - path: /api/auth/
            pathType: Prefix
            backend:
              service:
                name: front-portal-staging
                port:
                  number: 80
          - path: /api/health
            pathType: Prefix
            backend:
              service:
                name: front-portal-staging
                port:
                  number: 80
          - path: /api/media/
            pathType: Prefix
            backend:
              service:
                name: front-portal-staging
                port:
                  number: 80
          - path: /api/proxy/
            pathType: Prefix
            backend:
              service:
                name: front-portal-staging
                port:
                  number: 80
          - path: /api/verification/
            pathType: Prefix
            backend:
              service:
                name: front-portal-staging
                port:
                  number: 80
          - path: /api/account/
            pathType: Prefix
            backend:
              service:
                name: front-portal-staging
                port:
                  number: 80
          # --- 前端静态 / SSR ---
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-portal-staging
                port:
                  number: 80
---
# ============================================================================
#  front-portal-staging-api Ingress — 后端 API (HTTPS → api.midasmkts.net)
#  复用 midasmkts-staging/api-backend-staging ExternalName Service
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-portal-staging-api
  namespace: midasmkts-staging
  labels:
    app: front-portal-staging
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/upstream-vhost: "api.midasmkts.net"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: portal.midasmarkets.org
      http:
        paths:
          - path: /connect
            pathType: Prefix
            backend:
              service:
                name: api-backend-staging
                port:
                  number: 443
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-backend-staging
                port:
                  number: 443
          - path: /hub
            pathType: Prefix
            backend:
              service:
                name: api-backend-staging
                port:
                  number: 443
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: api-backend-staging
                port:
                  number: 443
          - path: /.well-known
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-backend-staging
                port:
                  number: 443
