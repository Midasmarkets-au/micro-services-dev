# ============================================================================
#  front-portal Ingress (midasmkts production)
#  portal/vu/au/bvi/sea/jp.midasmkts.com  →  midasmkts-prod/front-portal
#
#  2026-09-01 已切换生效：删除了旧的 mm-prod/midasmkts-ingress（曾指向
#  mm-prod/front-portal-product，该 Deployment 已一并清理），流量走本文件。
#  SSE /api/v1/event 走 api.midasmkts.net（旧 mm-prod/midasmkts-event-ingress
#  早已指向不存在的 boardcast svc，本就失效，已删）。
#
#  两个 Ingress 对象拆分原因：backend-protocol 是 per-ingress 注解——
#  front-portal 走 HTTP(:3000)，front-portal-api 走 HTTPS(api.midasmkts.net)。
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-portal
  namespace: midasmkts-prod
  labels:
    app: front-portal
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-prod
  rules:
    - host: portal.midasmkts.com
      http: &frontPortalPaths
        paths:
          - path: /api/user/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/action
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/auth/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/health
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/media/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/proxy/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/verification/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/account/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
    - host: vu.midasmkts.com
      http: *frontPortalPaths
    - host: au.midasmkts.com
      http: *frontPortalPaths
    - host: bvi.midasmkts.com
      http: *frontPortalPaths
    - host: sea.midasmkts.com
      http: *frontPortalPaths
    - host: jp.midasmkts.com
      http: *frontPortalPaths
---
# ---- 后端 API (HTTPS → api.midasmkts.net)，复用 midasmkts-prod/api-backend ----
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-portal-api
  namespace: midasmkts-prod
  labels:
    app: front-portal
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/upstream-vhost: "api.midasmkts.net"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-prod
  rules:
    - host: portal.midasmkts.com
      http: &apiPaths
        paths:
          - path: /connect
            pathType: Prefix
            backend: { service: { name: api-backend, port: { number: 443 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: api-backend, port: { number: 443 } } }
          - path: /hub
            pathType: Prefix
            backend: { service: { name: api-backend, port: { number: 443 } } }
          - path: /live
            pathType: Prefix
            backend: { service: { name: api-backend, port: { number: 443 } } }
          - path: /.well-known
            pathType: ImplementationSpecific
            backend: { service: { name: api-backend, port: { number: 443 } } }
    - host: vu.midasmkts.com
      http: *apiPaths
    - host: au.midasmkts.com
      http: *apiPaths
    - host: bvi.midasmkts.com
      http: *apiPaths
    - host: sea.midasmkts.com
      http: *apiPaths
    - host: jp.midasmkts.com
      http: *apiPaths
