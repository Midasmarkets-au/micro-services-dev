# ============================================================================
#  front-portal Ingress (midasmkts production) —— ⚠️ 切换时才 apply
#
#  当前 portal/vu/au/bvi/sea/jp.midasmkts.com 由 mm-prod/midasmkts-ingress
#  (同为 nginx-prod class) 指向 mm-prod/front-portal-product。
#  同 host + 同 path(/) 的两个 Ingress 跨 namespace 共存会冲突（nginx 取更早创建者）。
#
#  切换步骤：
#    1. 确认 midasmkts-prod/front-portal Deployment 就绪：
#         kubectl -n midasmkts-prod rollout status deploy/front-portal
#    2. 删除旧路由（同一时刻只保留一个）：
#         kubectl -n mm-prod delete ingress midasmkts-ingress
#       （如需保留 SSE，另见 mm-prod/midasmkts-event-ingress，可一并迁移到本 ns）
#    3. apply 本文件：
#         kubectl apply -f deployment/k8s/midasmkts-prod/front-portal-ingress.yaml
#    4. 验证 6 个域名 / 、/api、/hub、/connect 均正常后，
#       再考虑缩容 mm-prod/front-portal-product。
#
#  回滚：kubectl delete -f 本文件 && kubectl apply -f <旧 midasmkts-ingress 备份>
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-portal
  namespace: midasmkts-prod
  labels:
    app: front-portal
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-prod
  rules:
    - host: portal.midasmkts.com
      http: &frontPortalPaths
        paths:
          - path: /api/user/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/action
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/auth/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/health
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/media/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/proxy/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/verification/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /api/account/
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: front-portal, port: { number: 80 } } }
    - host: vu.midasmkts.com
      http: *frontPortalPaths
    - host: au.midasmkts.com
      http: *frontPortalPaths
    - host: bvi.midasmkts.com
      http: *frontPortalPaths
    - host: sea.midasmkts.com
      http: *frontPortalPaths
    - host: jp.midasmkts.com
      http: *frontPortalPaths
---
# ---- 后端 API (HTTPS → api.midasmkts.net)，复用 midasmkts-prod/api-backend ----
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-portal-api
  namespace: midasmkts-prod
  labels:
    app: front-portal
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/upstream-vhost: "api.midasmkts.net"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-prod
  rules:
    - host: portal.midasmkts.com
      http: &apiPaths
        paths:
          - path: /connect
            pathType: Prefix
            backend: { service: { name: api-backend, port: { number: 443 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: api-backend, port: { number: 443 } } }
          - path: /hub
            pathType: Prefix
            backend: { service: { name: api-backend, port: { number: 443 } } }
          - path: /live
            pathType: Prefix
            backend: { service: { name: api-backend, port: { number: 443 } } }
          - path: /.well-known
            pathType: ImplementationSpecific
            backend: { service: { name: api-backend, port: { number: 443 } } }
    - host: vu.midasmkts.com
      http: *apiPaths
    - host: au.midasmkts.com
      http: *apiPaths
    - host: bvi.midasmkts.com
      http: *apiPaths
    - host: sea.midasmkts.com
      http: *apiPaths
    - host: jp.midasmkts.com
      http: *apiPaths
