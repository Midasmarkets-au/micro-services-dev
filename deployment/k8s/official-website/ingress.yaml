# Official website ingress (production).
# Namespace: official-website
# IngressClass: nginx-official-website
#
# Apply:
#   kubectl apply -f deployment/k8s/official-website/ingress.yaml
#
# midasmkts.com -> www.midasmkts.com uses HTTP 307 (preserves path + query).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: official-website-ingress
  namespace: official-website
  labels:
    app: official-website
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx-official-website
  rules:
    - host: www.midasmkts.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: official-website
                port:
                  number: 80
    - host: k8s-ingressn-ingressn-6b7b42b795-4f907c405d56c57c.elb.ap-southeast-2.amazonaws.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: official-website
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: official-website-apex-redirect
  namespace: official-website
  labels:
    app: official-website
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: https://www.midasmkts.com$request_uri
    nginx.ingress.kubernetes.io/permanent-redirect-code: "307"
spec:
  ingressClassName: nginx-official-website
  rules:
    - host: midasmkts.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: official-website
                port:
                  number: 80
